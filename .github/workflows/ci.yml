name: ZYVORAX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check:
    name: Shell syntax and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do bash -n "$file"; done
          bash -n bin/zyvorax

      - name: Run smoke tests
        run: bash tests/smoke.sh
